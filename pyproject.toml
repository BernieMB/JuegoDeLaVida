[project]
name = "vida"
version = "0.1.0"
description = "El Juego de la Vida de Conway — simulacion interactiva con pygame-ce y NumPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pygame-ce>=2.5.0",
]

[project.scripts]
vida = "vida.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vida"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = [
    "slow: pruebas lentas (matusalenes de miles de generaciones). Ejecutar con: uv run pytest -m slow",
]
